# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_label:
        description: "Optional label suffix (e.g. 'hotfix-attempt')"
        required: false
        default: ""

# Serialize so rapid pushes queue rather than race to create the same tag.
concurrency:
  group: renderer-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history needed to find previous tags and scan commits

      - name: Compute release decision
        id: next
        run: |
          # --- Manual dispatch: always release as a dev prerelease ---
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHORT_SHA="${GITHUB_SHA::7}"
            LABEL="${{ inputs.release_label }}"
            if [[ -n "$LABEL" ]]; then
              TAG_NAME="dev-${SHORT_SHA}-${LABEL}"
            else
              TAG_NAME="dev-${SHORT_SHA}"
            fi
            echo "skip=false"            >> "$GITHUB_OUTPUT"
            echo "tag=${TAG_NAME}"       >> "$GITHUB_OUTPUT"
            echo "last_official=none"    >> "$GITHUB_OUTPUT"
            echo "prerelease=true"       >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Push to main ---

          # Skip if HEAD is already tagged
          for T in $(git tag -l 'v[0-9]*' --sort=-version:refname); do
            if [[ "$(git rev-list -n 1 "$T")" == "$GITHUB_SHA" ]]; then
              echo "HEAD already tagged as $T — skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # Anchor: last official versioned tag
          LAST_OFFICIAL=$(git tag -l 'v[0-9]*' | sort -V | tail -n 1)

          # Commits since last official tag (or all if none)
          if [[ -z "$LAST_OFFICIAL" ]]; then
            LOG=$(git log --format="%s%n%b" HEAD)
          else
            LOG=$(git log --format="%s%n%b" "${LAST_OFFICIAL}..HEAD")
          fi

          # Determine bump — skip entirely if no releasable commits
          BUMP="none"
          if echo "$LOG" | grep -qF "BREAKING CHANGE:" || echo "$LOG" | grep -qE "^[a-z]+(\([^)]+\))?!:"; then
            BUMP="major"
          elif echo "$LOG" | grep -qE "^feat(\([^)]+\))?:"; then
            BUMP="minor"
          elif echo "$LOG" | grep -qE "^(fix|perf)(\([^)]+\))?:"; then
            BUMP="patch"
          fi

          if [[ "$BUMP" == "none" ]]; then
            echo "No releasable commits since ${LAST_OFFICIAL:-the beginning} — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compute next version
          BASE="${LAST_OFFICIAL:-v0.0.0}"
          VERSION="${BASE#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          echo "skip=false"                             >> "$GITHUB_OUTPUT"
          echo "tag=v${MAJOR}.${MINOR}.${PATCH}"        >> "$GITHUB_OUTPUT"
          echo "last_official=${LAST_OFFICIAL:-none}"   >> "$GITHUB_OUTPUT"
          echo "prerelease=false"                       >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
        if: steps.next.outputs.skip != 'true'

      - name: Build
        if: steps.next.outputs.skip != 'true'
        run: pnpm run build
        env:
          TURBO_UI: "false"

      - name: Zip renderer dist
        if: steps.next.outputs.skip != 'true'
        run: |
          TAG="${{ steps.next.outputs.tag }}"
          ZIP_BASENAME="${TAG/\//-}"
          ZIP_NAME="${ZIP_BASENAME}.zip"
          bash .github/scripts/bundle-renderer.sh "$GITHUB_WORKSPACE/${ZIP_NAME}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Build release notes
        if: steps.next.outputs.skip != 'true'
        run: |
          ZIP_NAME="${{ env.ZIP_NAME }}"
          SHA256=$(sha256sum "$GITHUB_WORKSPACE/$ZIP_NAME" | awk '{print $1}')

          LAST="${{ steps.next.outputs.last_official }}"
          if [[ "$LAST" == "none" || -z "$LAST" ]]; then
            SUBJECTS=$(git log --format="%s" HEAD)
          else
            SUBJECTS=$(git log --format="%s" "${LAST}..HEAD")
          fi

          BREAKING=$(echo "$SUBJECTS" | grep -E "^[a-z]+(\([^)]+\))?!:" || true)
          FEATURES=$(echo "$SUBJECTS" | grep -E "^feat(\([^)]+\))?:" || true)
          FIXES=$(echo "$SUBJECTS" | grep -E "^(fix|perf)(\([^)]+\))?:" || true)

          {
            if [[ -n "$BREAKING" ]]; then
              echo "### Breaking Changes"
              echo "$BREAKING" | sed 's/^/- /'
              echo ""
            fi
            if [[ -n "$FEATURES" ]]; then
              echo "### Features"
              echo "$FEATURES" | sed 's/^/- /'
              echo ""
            fi
            if [[ -n "$FIXES" ]]; then
              echo "### Fixes"
              echo "$FIXES" | sed 's/^/- /'
              echo ""
            fi
            echo "---"
            echo "**SHA256:** \`${SHA256}\`"
          } > /tmp/release-notes.md

      - name: Create release
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.next.outputs.tag }}"
          PRERELEASE_FLAG=""
          if [[ "${{ steps.next.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # --target creates the tag via the GitHub API — no git push, no secondary workflow trigger
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE_FLAG \
            "$GITHUB_WORKSPACE/$ZIP_NAME"
